<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vídeo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    video {
      display: block;
      width: min(100%, 1100px);
      max-height: calc(100dvh - 32px);
      object-fit: contain;
      border-radius: 10px;
      background: #000;
    }
  </style>
</head>
<body>
  <video controls playsinline preload="metadata">
    <source src="video.mp4" type="video/mp4">
    Tu navegador no puede reproducir este vídeo.
  </video>
</body>
</html>
